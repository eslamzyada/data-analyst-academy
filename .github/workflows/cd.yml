name: CD

# A personal, local app: "delivery" is a packaged, runnable build, not a cloud deployment.
#  - After CI passes on main: package the app and keep it as a downloadable build artifact.
#  - When a version tag (v1.2.3) is pushed: run the whole CI gate on that exact commit, check the
#    tag is on main and matches app/package.json, package it, and publish a GitHub release.
# Every package is built from an allow-list and checked: it never contains learner progress.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify-release:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions: # what the called gate asks for (its main-guard job reads pull requests)
      contents: read
      pull-requests: read

  package:
    name: package
    needs: verify-release
    # main: only after CI succeeded for a push to main. Tag: only after the full gate passed on it.
    if: >-
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
        (github.event_name == 'push' && needs.verify-release.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: A release tag must point at a commit on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Install (npm ci)
        run: npm ci
      - name: Content validation
        run: npm run validate
      - name: Regenerate the practice data and confirm it matches the repository
        run: npm run check:repro
      - name: Build
        run: npm run build
      - name: Package
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: npm run package
      - name: Artifact name
        id: name
        working-directory: release
        run: echo "artifact=$(basename data-analyst-academy-*.zip .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: release/data-analyst-academy-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release
      - name: Publish the GitHub release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Data Analyst Academy $GITHUB_REF_NAME"
